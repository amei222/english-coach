<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SpeakUp">
  <title>SpeakUp · 英语精进</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-view="home">🗣️ SpeakUp <small>英语精进</small><span id="sync-dot" hidden></span></div>
    <nav id="nav">
      <button data-view="home"><span class="nav-icon">🏠</span><span class="nav-label">今日</span><span class="badge" hidden></span></button>
      <button data-view="chunks"><span class="nav-icon">🧠</span><span class="nav-label">语块</span><span class="badge" hidden></span></button>
      <button data-view="listen"><span class="nav-icon">🎧</span><span class="nav-label">听力</span><span class="badge" hidden></span></button>
      <button data-view="ielts"><span class="nav-icon">📝</span><span class="nav-label">雅思</span><span class="badge" hidden></span></button>
      <button data-view="chat"><span class="nav-icon">🤖</span><span class="nav-label">AI陪练</span><span class="badge" hidden></span></button>
      <button data-view="me"><span class="nav-icon">👤</span><span class="nav-label">我的</span><span class="badge" hidden></span></button>
    </nav>
  </header>
  <main id="app"></main>
  <div id="flash" class="toast-msg"></div>

  <script src="data/chunks.js?v=6"></script>
  <script src="data/words.js?v=6"></script>
  <script src="data/practice.js?v=6"></script>
  <script src="data/ielts.js?v=6"></script>
  <script src="js/speech.js?v=6"></script>
  <script src="js/ai.js?v=6"></script>
  <script src="js/sync.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
